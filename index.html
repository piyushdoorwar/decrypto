<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Decrypto - Strategic Word Cipher Game</title>
  <meta name="description" content="A strategic word-based cipher game for 4 players. Encrypt codes, decode clues, and outsmart your opponents!" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ff3366;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ffdd00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M10 15 L30 5 L310 5 L290 15 Z" fill="url(#logoGradient)" opacity="0.9"/>
        <path d="M10 65 L30 75 L310 75 L290 65 Z" fill="url(#logoGradient)" opacity="0.9"/>
        <path d="M20 20 L40 15 L280 15 L260 20 Z" fill="#1a3a52"/>
        <path d="M20 60 L40 65 L280 65 L260 60 Z" fill="#1a3a52"/>
        <text x="160" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="3">DECRYPTO</text>
      </svg>
    </div>
    <div class="hstack" style="gap:12px; margin-left:auto">
      <button class="btn-help" id="historyBtn" aria-label="History" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/>
          <path d="M7 16l4-4 4 4 5-5"/>
        </svg>
        <span>History</span>
      </button>
      <div class="status" id="netStatus">Offline</div>
    </div>
  </header>

  <main class="app" id="app"></main>

  <footer class="foot">
    <span>Single-word clues · 3-digit codes · 4 players</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Decrypto - Strategic Word Cipher Game</title>
  <meta name="description" content="A strategic word-based cipher game for 4 players. Encrypt codes, decode clues, and outsmart your opponents!" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">🔐</div>
      <div>
        <div class="title">Decrypto</div>
        <div class="subtitle">Strategic Word Cipher</div>
      </div>
    </div>
    <div class="hstack" style="gap:12px">
      <button class="btn-help" id="helpBtn" aria-label="Instructions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <path d="M12 17h.01"/>
        </svg>
        <span>How to Play</span>
      </button>
      <div class="status" id="netStatus">Offline</div>
    </div>
  </header>

  <main class="app" id="app"></main>

  <footer class="foot">
    <span>Single-word clues · 3-digit codes · 4 players</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>

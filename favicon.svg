<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3651d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2c6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7aa2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3ddc97;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  
  <!-- Lock body -->
  <rect x="20" y="28" width="24" height="20" rx="3" fill="url(#lock)" opacity="0.9"/>
  
  <!-- Lock shackle -->
  <path d="M 24 28 L 24 22 Q 24 16 32 16 Q 40 16 40 22 L 40 28" 
        stroke="url(#lock)" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.9"/>
  
  <!-- Keyhole -->
  <circle cx="32" cy="36" r="3" fill="#0b0d10" opacity="0.6"/>
  <rect x="30.5" y="36" width="3" height="6" rx="1.5" fill="#0b0d10" opacity="0.6"/>
  
  <!-- Numbers accent -->
  <text x="26" y="46" font-family="monospace" font-size="8" font-weight="bold" fill="#e9eef7" opacity="0.5">1</text>
  <text x="32" y="46" font-family="monospace" font-size="8" font-weight="bold" fill="#e9eef7" opacity="0.5">2</text>
  <text x="38" y="46" font-family="monospace" font-size="8" font-weight="bold" fill="#e9eef7" opacity="0.5">3</text>
</svg>

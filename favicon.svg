<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdd00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  
  <!-- Lock body with neon glow -->
  <rect x="20" y="28" width="24" height="20" rx="4" fill="url(#lock)" filter="url(#glow)"/>
  
  <!-- Lock shackle with neon effect -->
  <path d="M 24 28 L 24 20 Q 24 14 32 14 Q 40 14 40 20 L 40 28" 
        stroke="url(#lock)" 
        stroke-width="4.5" 
        fill="none" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- Keyhole -->
  <circle cx="32" cy="36" r="3.5" fill="#000" opacity="0.7"/>
  <rect x="30" y="36" width="4" height="7" rx="2" fill="#000" opacity="0.7"/>
  
  <!-- Decorative neon dots -->
  <circle cx="32" cy="32" r="1" fill="#ffdd00" opacity="0.6" filter="url(#glow)"/>
  <circle cx="28" cy="40" r="0.8" fill="#00ff88" opacity="0.5"/>
  <circle cx="36" cy="40" r="0.8" fill="#00ff88" opacity="0.5"/>
</svg>
